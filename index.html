<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://dbd-player-search.m-aa-k-one-for-all-a.chatgpt.site; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="psd-api-base" content="https://dbd-player-search.m-aa-k-one-for-all-a.chatgpt.site/api/">
  <meta name="psd-version" content="3.5.3">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P.S.D">
  <meta name="referrer" content="no-referrer">
  <title>P.S.D — DBD Player Search</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/knight-detective-eye-192-v1.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/knight-detective-eye-180-v1.png">
  <link rel="stylesheet" href="./styles.css?v=3.5.3">
  <script type="module" src="./app.js?v=3.5.3"></script>
</head>
<body>
  <main>
    <header class="app-header">
      <div class="brand"><h1>P.S.D</h1><p class="subtitle">Player Search DBD</p></div>
      <nav class="header-actions" aria-label="アプリ操作">
        <button id="open-history" class="icon-button" aria-label="履歴を開く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v5h5M12 7v5l3 2"/></svg></button>
      </nav>
    </header>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <section id="install-banner" class="panel install-banner" aria-label="iOSでの利用案内" hidden>
      <h2>ホーム画面から使えます</h2>
      <p>Safariの共有メニューから「ホーム画面に追加」を選んでください。ホーム画面でも使えます。履歴を移す前にバックアップしてください。</p>
    </section>
    <section class="panel" aria-labelledby="players-title">
      <div class="section-heading"><h2 id="players-title">対象プレイヤー</h2><span id="slot-count" class="muted"></span></div>
      <div id="names-container"></div>
      <button id="add-player" class="button secondary full">＋ プレイヤーを追加</button>
    </section>
    <button id="search" class="button primary full">検索</button>
    <section id="results" aria-label="プレイヤーごとの検索結果（本人一致は未確認）" aria-live="polite"></section>
    <footer><span id="app-version"></span><span id="offline-status"></span><p>検索情報の一致は、同一人物の証明ではありません。</p></footer>
    <noscript><p>このアプリはJavaScriptを有効にすると使用できます。</p></noscript>
  </main>
  <dialog id="data-dialog" aria-labelledby="data-title">
    <div class="dialog-heading"><h2 id="data-title">バックアップ・更新</h2><button id="close-data" class="button secondary" autofocus>完了</button></div>
    <p class="hint">入力と履歴は、この端末だけに保存します。旧アプリのJSONも読み込めます。</p>
    <div class="button-stack"><button id="export" class="button secondary">バックアップを書き出す</button><button id="import" class="button secondary">バックアップを読み込む</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="persist" class="button secondary">保存領域の保護をリクエスト</button></div>
    <p id="storage-status" class="hint" role="status"></p><hr>
    <button id="update" class="button secondary full">アプリの更新を確認</button>
    <p id="update-status" class="hint" role="status"></p>
  </dialog>
  <dialog id="history-dialog" aria-labelledby="history-title">
    <div class="dialog-heading"><h2 id="history-title">履歴</h2><button id="close-history" class="button secondary" autofocus>完了</button></div>
    <label for="history-filter">名前で絞り込む</label><input id="history-filter" type="search" autocomplete="off" placeholder="名前で検索">
    <p class="hint">日付を選ぶと、その日の検索履歴を表示します。履歴は自動保存します。</p>
    <div id="history-days" class="history-days"></div>
    <button id="open-data" class="button secondary full">バックアップ・更新</button>
    <button id="clear-history" class="button danger full">全履歴を削除</button>
  </dialog>
  <dialog id="history-day-dialog" aria-labelledby="history-day-title">
    <div class="dialog-heading"><h2 id="history-day-title">検索履歴</h2><button id="close-history-day" class="button secondary" autofocus>閉じる</button></div>
    <div id="history-day-list" class="history-list"></div>
  </dialog>
</body>
</html>
