<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P.S.D - DBD Player Search</title>
    
    <!-- Tailwind CSS (開発・プレビュー用CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0d0d0e; /* 深い闇 */
            color: #e5e7eb;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        .font-gothic {
            font-family: 'Cinzel', serif;
        }

        /* 枯れ草の荒野とナイトをイメージした重厚な背景 */
        .bg-knight-realm {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, rgba(30, 20, 20, 0.8) 0%, rgba(10, 10, 12, 1) 100%);
            z-index: -1;
        }

        /* いばらと鉄をイメージした装飾パネル */
        .glass-panel {
            background: rgba(20, 20, 22, 0.85);
            border: 1px solid rgba(80, 20, 20, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
        }

        /* 検索ボタン：真紅の薔薇と錆びた鉄のグラデーション */
        .btn-search {
            background: linear-gradient(180deg, #5a0505 0%, #200000 100%);
            border: 1px solid #8a0a0a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), inset 0 2px 2px rgba(255, 100, 100, 0.2);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            transition: all 0.1s ease-out;
        }
        .btn-search:active {
            transform: scale(0.97);
            background: linear-gradient(180deg, #3a0000 0%, #100000 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* アコーディオンアニメーション */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
        }
        .accordion-content.open {
            max-height: 600px;
            transition: max-height 0.5s ease-in-out;
        }

        /* レザー風入力欄 */
        .input-leather {
            background: rgba(10, 10, 12, 0.9);
            border: 1px solid #2a2a2e;
            color: #f3f4f6;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .input-leather:focus {
            border-color: #8a0a0a;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">

    <div class="bg-knight-realm"></div>

    <div class="w-full max-w-md h-full flex flex-col justify-between p-5 z-10 relative">
        
        <!-- ヘッダー (設定・履歴を右上に集約) -->
        <header class="flex justify-between items-start pt-4">
            <div>
                <h1 class="font-gothic text-4xl font-bold text-red-800 tracking-wider drop-shadow-lg">P.S.D</h1>
                <p class="text-[10px] font-bold tracking-[0.2em] text-zinc-500 mt-1 uppercase">DBD Player Search</p>
            </div>
            <div class="flex space-x-3">
                <button id="btn-open-history" class="w-10 h-10 rounded-lg glass-panel flex items-center justify-center text-red-500 hover:text-red-400 active:scale-95 transition" aria-label="履歴">
                    <i class="fa-solid fa-scroll text-sm"></i>
                </button>
                <button id="btn-open-settings" class="w-10 h-10 rounded-lg glass-panel flex items-center justify-center text-zinc-400 hover:text-zinc-300 active:scale-95 transition" aria-label="設定">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </header>

        <!-- メインコンテンツ (ノイズを排除した入力部) -->
        <main class="w-full flex-grow flex flex-col justify-center space-y-5 my-6">
            
            <div class="glass-panel p-5 space-y-4">
                <!-- Javascriptで入力欄が動的生成されます -->
                <div id="player-inputs" class="space-y-3"></div>
                
                <button id="btn-add-player" class="w-full py-2 bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 rounded-lg flex items-center justify-center text-xs text-zinc-400 font-bold transition active:scale-95">
                    <i class="fa-solid fa-plus mr-1.5"></i> プレイヤーを追加
                </button>
            </div>

            <!-- 検索ボタン (「検索」のみ) -->
            <button id="btn-execute-search" class="btn-search w-full py-4 rounded-xl text-xl font-gothic font-bold tracking-widest text-red-100 flex items-center justify-center gap-2">
                <i class="fa-solid fa-sword text-sm text-red-300"></i> 検索
            </button>

            <!-- 検索結果アコーディオン -->
            <div id="result-accordion" class="accordion-content">
                <div class="glass-panel p-4 rounded-xl space-y-3 mt-2">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                        <h3 class="text-xs font-bold text-red-600 flex items-center gap-2">
                            <i class="fa-solid fa-link"></i> 検索結果
                        </h3>
                        <button id="btn-close-results" class="text-xs text-zinc-500 hover:text-zinc-300">閉じる</button>
                    </div>
                    <div id="search-results-output" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </main>

        <footer class="pb-2 text-center">
            <div class="w-12 h-1 bg-zinc-700/50 rounded-full mx-auto"></div>
        </footer>
    </div>

    <!-- ================= モーダル群 ================= -->

    <!-- ⚙️ 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm glass-panel p-6 space-y-5 relative">
            <button id="btn-close-settings" class="absolute top-4 right-4 text-zinc-500 hover:text-white p-2"><i class="fa-solid fa-xmark"></i></button>
            
            <h2 class="font-gothic text-lg font-bold text-zinc-200 border-b border-zinc-800 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-gear text-red-700"></i> Settings
            </h2>
            
            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] text-zinc-500 uppercase tracking-wider font-bold">対象ゲームタイトル</label>
                    <select id="setting-game" class="w-full input-leather rounded-lg p-3 text-sm">
                        <option value="dbd">Dead by Daylight (dbd)</option>
                        <option value="apex">Apex Legends (apex)</option>
                        <option value="valorant">VALORANT (valorant)</option>
                    </select>
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-[10px] text-zinc-500 uppercase tracking-wider font-bold">検索ルーティングモード</label>
                    <select id="setting-routing" class="w-full input-leather rounded-lg p-3 text-sm">
                        <option value="smart">スマート検索 (プレフィックス + Google)</option>
                        <option value="direct">ダイレクトモード (Web直接検索)</option>
                        <option value="google">サーチエンジン限定</option>
                    </select>
                </div>
            </div>

            <div class="pt-4 border-t border-zinc-800">
                <p class="text-[10px] text-zinc-500 mb-2">バグ報告・機能要望はこちら</p>
                <button id="btn-submit-feedback" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded text-xs transition">
                    開発者へフィードバックを送信
                </button>
            </div>
        </div>
    </div>

    <!-- 📜 履歴モーダル -->
    <div id="history-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm glass-panel p-6 space-y-4 relative flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h2 class="font-gothic text-lg font-bold text-zinc-200 flex items-center gap-2">
                    <i class="fa-solid fa-scroll text-red-700"></i> History
                </h2>
                <button id="btn-close-history" class="text-zinc-500 hover:text-white p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-2">
                <input type="text" id="history-search" placeholder="名前で検索..." class="w-full input-leather rounded p-2 text-xs">
                <input type="date" id="history-date" class="w-full input-leather rounded p-2 text-xs">
            </div>

            <div id="history-list" class="flex-grow overflow-y-auto space-y-2 pr-1 min-h-[150px]">
                <!-- 履歴動的生成 -->
            </div>
            
            <button id="btn-clear-history" class="w-full py-2.5 border border-red-900/50 bg-red-950/20 text-red-500 rounded-lg text-xs font-bold hover:bg-red-900/40 transition">
                全履歴を削除
            </button>
        </div>
    </div>

    <!-- JS Logic (XSS対策・セキュア実装) -->
    <script>
        // 状態管理
        let state = {
            players: [''],
            history: [],
            settings: {
                game: 'dbd',
                routing: 'smart'
            }
        };

        // DOM Elements
        const els = {
            playerInputs: document.getElementById('player-inputs'),
            btnAddPlayer: document.getElementById('btn-add-player'),
            btnSearch: document.getElementById('btn-execute-search'),
            accordion: document.getElementById('result-accordion'),
            resultsOutput: document.getElementById('search-results-output'),
            btnCloseResults: document.getElementById('btn-close-results'),
            
            modalSettings: document.getElementById('settings-modal'),
            modalHistory: document.getElementById('history-modal'),
            btnOpenSettings: document.getElementById('btn-open-settings'),
            btnCloseSettings: document.getElementById('btn-close-settings'),
            btnOpenHistory: document.getElementById('btn-open-history'),
            btnCloseHistory: document.getElementById('btn-close-history'),
            
            settingGame: document.getElementById('setting-game'),
            settingRouting: document.getElementById('setting-routing'),
            btnFeedback: document.getElementById('btn-submit-feedback'),
            
            historyList: document.getElementById('history-list'),
            historySearch: document.getElementById('history-search'),
            historyDate: document.getElementById('history-date'),
            btnClearHistory: document.getElementById('btn-clear-history')
        };

        // 初期化処理
        function init() {
            loadData();
            bindEvents();
            renderInputs();
        }

        // データ読み込み（型チェック保護付き）
        function loadData() {
            try {
                const h = localStorage.getItem('psd_history');
                if (h) {
                    const parsed = JSON.parse(h);
                    if (Array.isArray(parsed)) state.history = parsed;
                }
                const g = localStorage.getItem('psd_game');
                if (g) state.settings.game = g;
                
                const r = localStorage.getItem('psd_routing');
                if (r) state.settings.routing = r;

                els.settingGame.value = state.settings.game;
                els.settingRouting.value = state.settings.routing;
            } catch (e) {
                console.error("Local storage read error", e);
            }
        }

        // イベントバインディング（インラインハンドラ排除）
        function bindEvents() {
            els.btnAddPlayer.addEventListener('click', addPlayer);
            els.btnSearch.addEventListener('click', executeSearch);
            els.btnCloseResults.addEventListener('click', () => els.accordion.classList.remove('open'));
            
            els.btnOpenSettings.addEventListener('click', () => els.modalSettings.classList.remove('hidden', 'flex'));
            els.btnOpenSettings.addEventListener('click', () => els.modalSettings.classList.add('flex'));
            els.btnCloseSettings.addEventListener('click', () => els.modalSettings.classList.add('hidden'));
            
            els.btnOpenHistory.addEventListener('click', () => {
                els.modalHistory.classList.remove('hidden');
                els.modalHistory.classList.add('flex');
                renderHistory();
            });
            els.btnCloseHistory.addEventListener('click', () => els.modalHistory.classList.add('hidden'));

            els.settingGame.addEventListener('change', (e) => saveSetting('game', e.target.value));
            els.settingRouting.addEventListener('change', (e) => saveSetting('routing', e.target.value));
            
            els.historySearch.addEventListener('input', renderHistory);
            els.historyDate.addEventListener('change', renderHistory);
            els.btnClearHistory.addEventListener('click', clearHistory);
            
            els.btnFeedback.addEventListener('click', () => {
                window.location.href = `mailto:support@example.com?subject=${encodeURIComponent('[P.S.D] フィードバック')}`;
            });
        }

        // 安全なDOM生成（textContentを徹底しXSSを根本から防止）
        function renderInputs() {
            els.playerInputs.innerHTML = '';
            state.players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center space-x-2';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = player;
                input.placeholder = 'プレイヤー名を入力';
                input.className = 'w-full h-11 rounded-lg input-leather px-4 text-sm font-medium';
                input.addEventListener('input', (e) => state.players[index] = e.target.value);

                row.appendChild(input);

                if (state.players.length > 1) {
                    const btnDel = document.createElement('button');
                    btnDel.className = 'w-11 h-11 flex-shrink-0 bg-red-950/30 rounded-lg border border-red-900/50 text-red-500 hover:bg-red-900/50 transition';
                    btnDel.innerHTML = '<i class="fa-solid fa-minus"></i>';
                    btnDel.addEventListener('click', () => {
                        state.players.splice(index, 1);
                        renderInputs();
                    });
                    row.appendChild(btnDel);
                }

                els.playerInputs.appendChild(row);
            });
        }

        function addPlayer() {
            if (state.players.length >= 10) return;
            state.players.push('');
            renderInputs();
        }

        function saveSetting(key, value) {
            state.settings[key] = value;
            try {
                localStorage.setItem(`psd_${key}`, value);
            } catch (e) {}
        }

        // 検索処理
        function executeSearch() {
            const targets = state.players.map(p => p.trim()).filter(p => p !== '');
            if (targets.length === 0) return alert('プレイヤー名を入力してください。');

            const today = new Date().toLocaleDateString('ja-JP');
            els.resultsOutput.innerHTML = '';

            targets.forEach(player => {
                addHistory(player, today);

                // ルーティング適用
                let query = '';
                const { game, routing } = state.settings;
                if (routing === 'smart') query = `${game} ${player}`;
                else if (routing === 'direct') query = player;
                else query = `${player}`;

                const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;

                // 結果DOMの安全な構築
                const wrap = document.createElement('div');
                wrap.className = 'p-3 bg-black/40 rounded-lg border border-zinc-800 flex justify-between items-center';
                
                const nameCol = document.createElement('div');
                const badge = document.createElement('span');
                badge.className = 'text-[9px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded mr-2 font-bold';
                badge.textContent = game.toUpperCase();
                
                const nameTxt = document.createElement('span');
                nameTxt.className = 'text-sm font-bold text-zinc-200';
                nameTxt.textContent = player;
                
                nameCol.appendChild(badge);
                nameCol.appendChild(nameTxt);

                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.className = 'text-[10px] font-bold text-red-500 bg-red-950/30 border border-red-900/50 px-3 py-1.5 rounded hover:bg-red-900/50 transition';
                link.innerHTML = '追跡 <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>';

                wrap.appendChild(nameCol);
                wrap.appendChild(link);
                els.resultsOutput.appendChild(wrap);
            });

            els.accordion.classList.add('open');
            setTimeout(() => els.accordion.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        // 履歴管理
        function addHistory(name, date) {
            state.history = state.history.filter(h => !(h.name === name && h.date === date));
            state.history.unshift({ id: Date.now() + Math.random(), name, date });
            if (state.history.length > 100) state.history.length = 100;
            try { localStorage.setItem('psd_history', JSON.stringify(state.history)); } catch (e) {}
        }

        function renderHistory() {
            els.historyList.innerHTML = '';
            const search = els.historySearch.value.toLowerCase();
            const fDate = els.historyDate.value ? new Date(els.historyDate.value).toLocaleDateString('ja-JP') : '';

            const filtered = state.history.filter(h => {
                if (!h || !h.name) return false;
                const matchName = h.name.toLowerCase().includes(search);
                const matchDate = fDate ? h.date === fDate : true;
                return matchName && matchDate;
            });

            if (filtered.length === 0) {
                els.historyList.innerHTML = '<p class="text-xs text-zinc-600 text-center py-4">履歴がありません</p>';
                return;
            }

            filtered.forEach(h => {
                const wrap = document.createElement('div');
                wrap.className = 'flex justify-between items-center p-2.5 bg-zinc-900/50 rounded border border-zinc-800';
                
                const info = document.createElement('div');
                info.className = 'cursor-pointer flex-grow';
                info.addEventListener('click', () => {
                    state.players = [h.name];
                    renderInputs();
                    els.modalHistory.classList.add('hidden');
                    els.accordion.classList.remove('open');
                });

                const n = document.createElement('div');
                n.className = 'text-sm font-medium text-zinc-200';
                n.textContent = h.name;
                const d = document.createElement('div');
                d.className = 'text-[9px] text-zinc-500';
                d.textContent = h.date;

                info.appendChild(n);
                info.appendChild(d);

                const del = document.createElement('button');
                del.className = 'text-zinc-600 hover:text-red-500 p-2';
                del.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                del.addEventListener('click', () => {
                    state.history = state.history.filter(item => item.id !== h.id);
                    try { localStorage.setItem('psd_history', JSON.stringify(state.history)); } catch (e) {}
                    renderHistory();
                });

                wrap.appendChild(info);
                wrap.appendChild(del);
                els.historyList.appendChild(wrap);
            });
        }

        function clearHistory() {
            if (!confirm('全履歴を削除しますか？')) return;
            state.history = [];
            try { localStorage.removeItem('psd_history'); } catch (e) {}
            renderHistory();
        }

        // 起動
        init();
    </script>
</body>
</html>
