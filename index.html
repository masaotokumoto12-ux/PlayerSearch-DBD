<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Player Check Pro</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none';" />
  
  <meta name="theme-color" content="#0c0d0f" />
  <meta name="color-scheme" content="dark" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="D.P.S" />

  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d0f;
      --surface: rgba(22, 24, 28, 0.85);
      --border: #2a2e35;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --danger: #f28b82;
      --radius: 12px;
      --tap-target: 48px; 
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--fg);
      line-height: 1.5;
      background-color: var(--bg);
      background-image: linear-gradient(rgba(12, 13, 15, 0.7), rgba(12, 13, 15, 0.95)), url('bg-knight.jpg');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .settings-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      width: var(--tap-target);
      height: var(--tap-target);
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    
    #settings-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 100;
      padding: env(safe-area-inset-top) 16px 0;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .modal-header h2 { margin: 0; font-size: 1.2rem; }
    .close-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
    }
    
    .config-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
    }
    .config-row { margin-bottom: 16px; }
    .config-row:last-child { margin-bottom: 0; }
    
    label.field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    
    select.ui-select, input[type="text"] {
      width: 100%;
      min-height: var(--tap-target);
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.6);
      color: var(--fg);
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(4px);
    }
    select.ui-select { appearance: none; cursor: pointer; }
    input[type="text"]:focus, select.ui-select:focus { border-color: var(--accent); }
    
    #game-custom { margin-top: 12px; }
    
    .names { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .name-row { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      min-height: var(--tap-target); min-width: var(--tap-target);
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius); font-size: 1.25rem; font-weight: bold; flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .add-btn { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
    .rm-btn { background: rgba(0,0,0,0.4); color: var(--danger); border: 1px solid var(--border); }
    
    button.primary-btn {
      width: 100%; min-height: 56px; border: none; border-radius: var(--radius);
      background: var(--accent); color: #000; font-size: 1.1rem; font-weight: 700;
      margin-bottom: 32px; box-shadow: 0 4px 12px rgba(138, 180, 248, 0.2);
    }
    
    .player-block { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 24px; border: 1px solid var(--border); backdrop-filter: blur(8px); }
    .player-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .player-block-header h2 { font-size: 1.1rem; margin: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .delete-block-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--danger); font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; }
    
    ul.result-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    li.result-item { display: flex; align-items: center; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid transparent; transition: border-color 0.2s; }
    li.result-item:active { border-color: var(--accent); }
    a.card-link { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--fg); min-height: var(--tap-target); }
    .card-title { font-weight: 600; font-size: 0.95rem; }
    .card-hint { font-size: 0.8rem; color: var(--muted); }
    .empty-msg { color: var(--muted); text-align: center; font-size: 0.95rem; padding: 24px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .spacer { min-width: var(--tap-target); flex-shrink: 0; }
  </style>
</head>
<body>
  
  <div id="settings-modal">
    <div class="modal-header">
      <h2>各種設定・詳細</h2>
      <button class="close-btn" id="close-settings">完了</button>
    </div>

    <div class="config-block">
      <div class="config-row">
        <label class="field-label">対象ゲームタイトル</label>
        <select id="game-select" class="ui-select">
          <option value="dbd">Dead by Daylight (DBD)</option>
          <option value="apex">Apex Legends</option>
          <option value="valorant">VALORANT</option>
          <option value="other">その他（自由入力）</option>
        </select>
        <input type="text" id="game-custom" placeholder="ゲーム名を入力..." style="display:none;" autocomplete="off" />
      </div>
      <div class="config-row">
        <label class="field-label">検索ルーティングモード</label>
        <select id="search-mode" class="ui-select">
          <option value="smart">スマート検索（最速自動判別）</option>
          <option value="force-google">すべてGoogle検索を強制</option>
        </select>
      </div>
    </div>
  </div>

  <main>
    <header>
      <h1>P.S.D</h1>
      <button class="settings-btn" id="open-settings" title="設定">⚙️</button>
    </header>

    <label class="field-label">プレイヤー名入力</label>
    <div class="names" id="names-container"></div>

    <button type="button" id="btn-search" class="primary-btn">検索</button>
    <div id="results-container"></div>
  </main>

  <script>
    (function () {
      "use strict";

      const MAX_SLOTS = 4;
      const STORAGE_KEY = "player-check-pro-v2";
      
      const PLATFORMS = [
        { id: "steam", name: "Steam", desc: "コミュニティプロフィール" },
        { id: "x", name: "X (Twitter)", desc: "アカウント直撃" },
        { id: "youtube", name: "YouTube", desc: "チャンネルホーム" },
        { id: "twitch", name: "Twitch", desc: "配信チャンネル" },
        { id: "tiktok", name: "TikTok", desc: "ユーザープロフィール" },
        { id: "5ch", name: "5ちゃんねる", desc: "現行スレッド" }
      ];

      let appState = {
        gameSelect: "dbd",
        gameCustom: "",
        searchMode: "smart",
        inputs: [""],
        results: []
      };

      function injectDynamicManifest() {
        const manifestJSON = {
          name: "P.S.D",
          short_name: "P.S.D",
          display: "standalone",
          background_color: "#0c0d0f",
          theme_color: "#0c0d0f",
          icons: [
            { src: "icon.png", sizes: "192x192 512x512", type: "image/png" }
          ]
        };
        try {
          const blob = new Blob([JSON.stringify(manifestJSON)], { type: "application/manifest+json" });
          const link = document.createElement("link");
          link.rel = "manifest";
          link.href = URL.createObjectURL(blob);
          document.head.appendChild(link);
        } catch(e) {}
      }

      function getSafeUrl(urlStr) {
        try {
          const url = new URL(urlStr, window.location.origin);
          if (url.protocol === "http:" || url.protocol === "https:") return url.href;
        } catch (e) {}
        return "about:blank";
      }

      function buildGoogleSearchUrl(query) {
        return "https://www.google.com/search?q=" + encodeURIComponent(query);
      }

      // 【完全修復版】エラーゼロ・全SNSダイレクト対応ロジック
      function generateLinks(playerName) {
        const trimmedName = playerName.trim();
        if (!trimmedName) return [];

        let prefix = appState.gameSelect === "other" ? appState.gameCustom : appState.gameSelect;
        prefix = prefix.trim() ? prefix.trim() + " " : "";
        
        // ハイフンやドットを含むID形式も正しく判定（YouTube等の新ハンドル対応）
        const isHandle = /^[A-Za-z0-9_.-]+$/.test(trimmedName);

        return PLATFORMS.map(function(platform) {
          let targetUrl = "";
          switch (platform.id) {
            case "steam": 
              targetUrl = "https://steamcommunity.com/search/users/?text=" + encodeURIComponent(trimmedName); 
              break;
            case "x": 
              targetUrl = (appState.searchMode === "smart" && isHandle) 
                ? "https://x.com/" + encodeURIComponent(trimmedName) 
                : buildGoogleSearchUrl(trimmedName + " " + prefix + "site:x.com OR site:twitter.com"); 
              break;
            case "youtube": 
              // IDなら直接チャンネルトップへ。日本語なら安全にGoogle検索。
              targetUrl = (appState.searchMode === "smart" && isHandle)
                ? "https://www.youtube.com/@" + encodeURIComponent(trimmedName)
                : buildGoogleSearchUrl(trimmedName + " " + prefix + "site:youtube.com"); 
              break;
            case "twitch": 
              targetUrl = (appState.searchMode === "smart" && isHandle) 
                ? "https://www.twitch.tv/" + encodeURIComponent(trimmedName.toLowerCase()) 
                : buildGoogleSearchUrl(trimmedName + " " + prefix + "site:twitch.tv"); 
              break;
            case "tiktok": 
              // IDなら直接プロフィールへ。日本語なら安全にGoogle検索。
              targetUrl = (appState.searchMode === "smart" && isHandle)
                ? "https://www.tiktok.com/@" + encodeURIComponent(trimmedName)
                : buildGoogleSearchUrl(trimmedName + " " + prefix + "site:tiktok.com"); 
              break;
            case "5ch": 
              targetUrl = buildGoogleSearchUrl(trimmedName + " " + prefix + "site:5ch.net/test/read.cgi/"); 
              break;
          }
          return { platformName: platform.name, desc: platform.desc, url: getSafeUrl(targetUrl) };
        });
      }

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.gameSelect) appState.gameSelect = parsed.gameSelect;
            if (parsed.gameCustom !== undefined) appState.gameCustom = parsed.gameCustom;
            if (parsed.searchMode) appState.searchMode = parsed.searchMode;
            if (Array.isArray(parsed.inputs) && parsed.inputs.length > 0) appState.inputs = parsed.inputs;
            if (Array.isArray(parsed.results)) appState.results = parsed.results;
          }
        } catch (e) {}
      }

      function syncSettingsUI() {
        const selectEl = document.getElementById("game-select");
        const customEl = document.getElementById("game-custom");
        
        selectEl.value = appState.gameSelect;
        customEl.value = appState.gameCustom;
        customEl.style.display = appState.gameSelect === "other" ? "block" : "none";
        document.getElementById("search-mode").value = appState.searchMode;
      }

      function handleSettingsChange() {
        appState.gameSelect = document.getElementById("game-select").value;
        appState.gameCustom = document.getElementById("game-custom").value;
        appState.searchMode = document.getElementById("search-mode").value;
        document.getElementById("game-custom").style.display = appState.gameSelect === "other" ? "block" : "none";
        saveState();
      }

      function renderInputForm() {
        const container = document.getElementById("names-container");
        container.innerHTML = ""; 

        appState.inputs.forEach(function(val, index) {
          const row = document.createElement("div");
          row.className = "name-row";

          if (index === 0) {
            const addBtn = document.createElement("button");
            addBtn.className = "icon-btn add-btn";
            addBtn.textContent = "＋";
            addBtn.disabled = appState.inputs.length >= MAX_SLOTS;
            addBtn.addEventListener("click", function() {
              if (appState.inputs.length >= MAX_SLOTS) return;
              updateInputs(); appState.inputs.push(""); renderInputForm(); saveState();
            });
            row.appendChild(addBtn);
          } else {
            const sp = document.createElement("div"); sp.className = "spacer"; row.appendChild(sp);
          }

          const input = document.createElement("input");
          input.type = "text"; input.value = val; input.placeholder = "プレイヤー名を入力";
          input.addEventListener("input", function() { updateInputs(); saveState(); });
          row.appendChild(input);

          if (index > 0) {
            const rmBtn = document.createElement("button");
            rmBtn.className = "icon-btn rm-btn"; rmBtn.textContent = "×";
            rmBtn.addEventListener("click", function() {
              updateInputs(); appState.inputs.splice(index, 1); renderInputForm(); saveState();
            });
            row.appendChild(rmBtn);
          } else {
            const sp2 = document.createElement("div"); sp2.className = "spacer"; row.appendChild(sp2);
          }
          container.appendChild(row);
        });
      }

      function updateInputs() {
        appState.inputs = Array.from(document.querySelectorAll("#names-container input[type='text']")).map(n => n.value);
      }

      function renderResults() {
        const container = document.getElementById("results-container");
        container.innerHTML = "";
        if (appState.results.length === 0) {
          const p = document.createElement("p"); p.className = "empty-msg"; p.textContent = "プレイヤー名を入力して検索をタップしてください。";
          container.appendChild(p); return;
        }

        appState.results.forEach(function(block, bi) {
          const bDiv = document.createElement("div"); bDiv.className = "player-block";
          const hDiv = document.createElement("div"); hDiv.className = "player-block-header";
          const h2 = document.createElement("h2"); h2.textContent = block.playerName;
          const dBtn = document.createElement("button"); dBtn.className = "delete-block-btn"; dBtn.textContent = "削除";
          dBtn.addEventListener("click", function() { appState.results.splice(bi, 1); renderResults(); saveState(); });
          
          hDiv.appendChild(h2); hDiv.appendChild(dBtn); bDiv.appendChild(hDiv);

          const ul = document.createElement("ul"); ul.className = "result-list";
          block.links.forEach(function(link) {
            const li = document.createElement("li"); li.className = "result-item";
            const a = document.createElement("a"); a.className = "card-link"; a.href = link.url; a.target = "_blank";
            const tSpan = document.createElement("span"); tSpan.className = "card-title"; tSpan.textContent = link.platformName;
            const hSpan = document.createElement("span"); hSpan.className = "card-hint"; hSpan.textContent = link.desc;
            a.appendChild(tSpan); a.appendChild(hSpan); li.appendChild(a); ul.appendChild(li);
          });
          bDiv.appendChild(ul); container.appendChild(bDiv);
        });
      }

      function executeSearch() {
        updateInputs();
        const valid = appState.inputs.map(n => n.trim()).filter(n => n !== "");
        if (valid.length === 0) return;
        appState.results = valid.map(name => ({ playerName: name, links: generateLinks(name) }));
        renderResults(); saveState();
        document.getElementById("results-container").scrollIntoView({ behavior: 'smooth' });
      }

      function init() {
        injectDynamicManifest();
        loadState();
        syncSettingsUI();
        renderInputForm();
        renderResults();

        document.getElementById("game-select").addEventListener("change", handleSettingsChange);
        document.getElementById("game-custom").addEventListener("input", handleSettingsChange);
        document.getElementById("search-mode").addEventListener("change", handleSettingsChange);
        document.getElementById("btn-search").addEventListener("click", executeSearch);
        
        document.getElementById("open-settings").addEventListener("click", function() {
          document.getElementById("settings-modal").style.display = "block";
        });
        document.getElementById("close-settings").addEventListener("click", function() {
          document.getElementById("settings-modal").style.display = "none";
        });
      }

      if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
      } else {
          init();
      }
    })();
  </script>
</body>
</html>
